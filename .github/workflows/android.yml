name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # 알림판은 매니페스트에 알림 읽기 서비스 하나만 더함. lintNotiDebug 는 main 매니페스트의
      # foregroundServiceType 을 못 보고 ForegroundServiceType 오류를 내서(병합된 APK 에는 있음) 기본판만 검사
      - name: Test & build
        run: ./gradlew testBasicDebugUnitTest lintBasicDebug assembleRelease
      - uses: actions/upload-artifact@v4
        # 계정의 아티팩트 저장 용량이 차면 업로드만 실패하므로 빌드 결과에는 영향 주지 않음
        continue-on-error: true
        with:
          retention-days: 7
          name: ttaak-apk
          path: app/build/outputs/apk/*/release/*.apk
